name: Release smoke test

on:
  push:
    tags:
      - "v*"

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build npm package
        run: npm run package:npm

      - name: Smoke test dist/cli.js
        run: node dist/cli.js --version | grep -q cloudcode

  compiled-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: release/cloudcode-win-x64.exe
          - os: ubuntu-latest
            binary: release/cloudcode-linux-x64
          # build-binaries.sh emits macOS binaries too; run each on a runner
          # of its own architecture (macos-latest is arm64, macos-13 x64).
          - os: macos-latest
            binary: release/cloudcode-macos-arm64
          - os: macos-13
            binary: release/cloudcode-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      # npm's package:bin script shells out to PowerShell, which is not
      # present on the Linux/macOS images; run the platform-matched build
      # script directly so every leg of this matrix works.
      - name: Build compiled binary (Windows)
        if: runner.os == 'Windows'
        run: npm run package:bin

      - name: Build compiled binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build-binaries.sh

      - name: Smoke test compiled binary
        shell: bash
        run: |
          test -f "${{ matrix.binary }}"
          "${{ matrix.binary }}" --version | grep -q cloudcode

  # The Inno Setup definition is never exercised by the other legs, so a
  # broken .iss would otherwise surface only when someone runs
  # package:installer mid-release with ISCC installed locally.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      # The installer packages release/cloudcode-win-x64.exe, so build it first.
      - name: Build Windows binary
        run: npm run package:bin

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Smoke test installer artifact
        shell: pwsh
        run: |
          $version = (Get-Content src/version.ts | Select-String '"([^"]+)"').Matches[0].Groups[1].Value
          $path = "release/cloudcode-setup-$version.exe"
          if (-not (Test-Path $path)) { throw "installer artifact not found: $path" }
          Write-Host "Installer built: $path"

  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            glob: "release/desktop/*.exe"
          - os: ubuntu-latest
            flag: --linux
            glob: "release/desktop/*.AppImage"
          - os: macos-latest
            flag: --mac
            glob: "release/desktop/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:package -- ${{ matrix.flag }}
      - run: ls ${{ matrix.glob }}
